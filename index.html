<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Fredoka', cursive, sans-serif;
  }

  body {
    background: radial-gradient(circle at center, #fff2f6, #ffdbe5);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    position: relative;
    padding: 20px;
  }

  /* Floating background animated icons */
  .bg-icon {
    position: fixed;
    font-size: 20px;
    animation: floatUp linear infinite;
    bottom: -10vh;
    user-select: none;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(0.8) rotate(0deg);
      opacity: 0;
    }
    30% {
      opacity: 0.7;
    }
    100% {
      transform: translateY(-115vh) scale(1.3) rotate(360deg);
      opacity: 0;
    }
  }

  /* Floating Music Disc Controller */
  .music-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #ff7b9a;
    box-shadow: 0 4px 12px rgba(255, 123, 154, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 20px;
    z-index: 100;
    transition: transform 0.2s;
  }

  .music-btn:hover {
    transform: scale(1.1);
  }

  .rotating {
    animation: spin 3s linear infinite;
  }

  @keyframes spin {
    100% {
      transform: rotate(360deg);
    }
  }

  /* Main Card Container */
  .card {
    background: rgba(255, 255, 255, 0.96);
    border-radius: 28px;
    box-shadow: 0 20px 45px rgba(255, 130, 160, 0.25);
    padding: 30px 22px;
    text-align: center;
    max-width: 420px;
    width: 100%;
    z-index: 10;
    position: relative;
    animation: fadeIn 0.5s ease-in-out;
    display: block;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(18px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  h1 {
    color: #3f2a32;
    font-size: 25px;
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .highlight {
    color: #e63964;
  }

  /* Opening Screen: Animated Mini AI Avatar */
  .mini-avatar-container {
    margin: 15px auto;
    display: inline-block;
    animation: cuteBounce 2.5s ease-in-out infinite;
  }

  .mini-avatar-img {
    width: 145px;
    height: 145px;
    border-radius: 50%;
    border: 4px solid #ff7b9a;
    box-shadow: 0 10px 25px rgba(255, 123, 154, 0.35);
    object-fit: cover;
    object-position: top center;
    display: block;
  }

  @keyframes cuteBounce {
    0%, 100% {
      transform: translateY(0px) rotate(0deg);
    }
    25% {
      transform: translateY(-8px) rotate(-3deg);
    }
    75% {
      transform: translateY(-4px) rotate(3deg);
    }
  }

  p {
    color: #634b53;
    font-size: 15px;
    line-height: 1.6;
    margin: 12px 0;
  }

  .btn-group {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
  }

  button {
    border: none;
    padding: 12px 26px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn-primary {
    background: linear-gradient(135deg, #ff6b8b, #e63964);
    color: #ffffff;
    box-shadow: 0 6px 16px rgba(230, 57, 100, 0.35);
  }

  .btn-primary:hover {
    transform: scale(1.04);
    box-shadow: 0 8px 20px rgba(230, 57, 100, 0.45);
  }

  .btn-secondary {
    background-color: #f1eff2;
    color: #796c72;
  }

  .hidden {
    display: none !important;
  }

  /* Screen 2: Polaroid Photo */
  .polaroid-frame {
    background: white;
    padding: 12px 12px 18px 12px;
    border-radius: 8px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
    transform: rotate(-2deg);
    margin: 18px auto;
    max-width: 270px;
    border: 1px solid #f0e6e8;
  }

  .polaroid-img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    border-radius: 4px;
    display: block;
  }

  .polaroid-caption {
    font-family: 'Caveat', cursive;
    font-size: 21px;
    color: #e63964;
    margin-top: 10px;
  }

  /* Screen 3: Heartfelt Letter */
  .letter {
    text-align: left;
    line-height: 1.7;
    font-size: 14.5px;
    color: #4a343b;
    background: #fff8fa;
    padding: 22px;
    border-radius: 18px;
    border: 1.5px dashed #f6b5c4;
  }

  .letter h2 {
    text-align: center;
    margin-bottom: 12px;
    color: #e63964;
    font-size: 21px;
  }

  .letter-sign {
    text-align: right;
    margin-top: 16px;
    font-weight: 600;
    color: #d35400;
  }

  /* Screen 4: Fix Your Friendship Heart */
  .heart-puzzle-stage {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin: 25px 0 15px 0;
    position: relative;
  }

  .dashed-box {
    width: 130px;
    height: 130px;
    border: 2.5px dashed #e63964;
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff7fa;
    position: relative;
    cursor: pointer;
  }

  .ghost-heart {
    font-size: 65px;
    opacity: 0.25;
    filter: grayscale(0.4);
    transition: all 0.5s ease;
  }

  .heart-half-btn {
    font-size: 48px;
    cursor: pointer;
    background: #ffe3ec;
    border-radius: 50%;
    width: 65px;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(230, 57, 100, 0.2);
    transition: transform 0.2s;
  }

  .heart-half-btn:hover {
    transform: scale(1.15);
  }

  .mended-full {
    font-size: 72px !important;
    opacity: 1 !important;
    animation: heartPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes heartPop {
    0% {
      transform: scale(0.3);
      opacity: 0;
    }
    70% {
      transform: scale(1.25);
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }

  /* Screen 5: Age & AI Cartoon Poster */
  .age-card-box {
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    margin: 15px 0;
    padding: 26px 15px 22px 15px;
    background-size: cover;
    background-position: center top;
    background-image: linear-gradient(rgba(255, 245, 248, 0.88), rgba(255, 235, 242, 0.94)), url('Image%20(11).jfif.jfif');
    border: 2px solid #ffe0ea;
  }

  .age-pill {
    display: inline-block;
    padding: 5px 16px;
    background: #ffffff;
    border-radius: 20px;
    font-size: 13px;
    color: #9a5369;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .big-age {
    font-family: 'Playfair Display', serif;
    font-size: 72px;
    font-weight: 900;
    color: #e63964;
    line-height: 1;
    margin: 14px 0 4px 0;
  }

  /* Avatar preview positioned to show her face and hair fully */
  .avatar-preview {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3.5px solid #ff7b9a;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    object-fit: cover;
    object-position: top center;
    margin-top: 10px;
    display: inline-block;
  }

  /* Screen 6: Balloon Popping */
  .balloon-counter {
    font-size: 14px;
    color: #e63964;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .balloon-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 10px;
    min-height: 200px;
  }

  .balloon-item {
    font-size: 45px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease;
    animation: gentleFloat 2.5s ease-in-out infinite alternate;
  }

  .balloon-item:hover {
    transform: scale(1.25);
  }

  @keyframes gentleFloat {
    0% {
      transform: translateY(0px);
    }
    100% {
      transform: translateY(-8px);
    }
  }

  /* Screen 7: Cake & Celebration */
  .cake-container {
    margin: 25px auto 15px auto;
    cursor: pointer;
    display: inline-block;
  }

  .cake-icon {
    font-size: 75px;
    display: block;
    transition: transform 0.3s;
  }

  .cake-container:hover .cake-icon {
    transform: scale(1.1);
  }
</style>
